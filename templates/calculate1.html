<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            padding: 20px;
        }

        .calculator-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            color: #0f172a;
            background: #f8fafc;
            transition: all 0.25s ease;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* ===== Operations Grid ===== */
        .operations-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        button {
            height: 50px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        button:active {
            transform: translateY(0);
        }

        #sum { background: #10b981; }
        #sum:hover { background: #059669; }

        #sub { background: #f59e0b; }
        #sub:hover { background: #d97706; }

        #mul { background: #3b82f6; }
        #mul:hover { background: #2563eb; }

        #div { background: #ec4899; }
        #div:hover { background: #db2777; }

        .result-box {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-top: 20px;
        }

        .result-box h2 {
            color: #0f172a;
            font-size: 18px;
            font-weight: 700;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }

        @media (max-width: 480px) {
            .calculator-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>Flask Calculator</h1>

        <form action="{{ url_for('calculate1')}}" method="post">
            <div class="input-group">
                <label for="A">Variable A</label>
                <input type="text" id="A" name="A" placeholder="Enter value A" required>
            </div>

            <div class="input-group">
                <label for="B">Variable B</label>
                <input type="text" id="B" name="B" placeholder="Enter value B" required>
            </div>

            <div class="operations-grid">
                <button type="submit" name="operation" value="sum" id="sum">Add (+)</button>
                <button type="submit" name="operation" value="sub" id="sub">Subtract (-)</button>
                <button type="submit" name="operation" value="mul" id="mul">Multiply (×)</button>
                <button type="submit" name="operation" value="div" id="div">Divide (÷)</button>
            </div>
        </form>

        {% if result is not none %}
        <div class="result-box">
            <h2>Result: {{ result }}</h2>
        </div>
        {% endif %}
    </div>

    <div class="footer">
        Flask Calculator • Python Web Application
    </div>

</body>
</html>
