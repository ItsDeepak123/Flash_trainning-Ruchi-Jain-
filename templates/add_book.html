<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div>
        <h1>📚 Library Management System</h1>
        <p>Add New Book</p>
    </div>

    <a class="logout" href="{{ url_for('logout') }}">Logout</a>
</header>


<div class="container">

    <h2>➕ Add New Book</h2>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Book Name"
               required>


        <input type="text"
               name="category"
               placeholder="Category"
               required>

        <input type="number"
               name="quantity"
               placeholder="Quantity"
               min="1"
               required>

        <button type="submit">
            Add Book
        </button>

    </form>

    <br>

    <a href="{{ url_for('home') }}">
        <button type="button">Back to Home</button>
    </a>

</div>

</body>
</html>
