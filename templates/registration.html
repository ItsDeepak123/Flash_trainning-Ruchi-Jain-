<!DOCTYPE html>
<html>

<head>

    <title>Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📝Library Registration</h1>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required>

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already registered?
        <a href="{{ url_for('login') }}">🔐Login</a>
    </p>

</div>

</body>

</html>
