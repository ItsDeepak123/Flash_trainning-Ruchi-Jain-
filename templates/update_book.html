<!DOCTYPE html>
<html>

<head>

    <title>Update Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Update Book</h1>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ book.name }}"
               placeholder="Book Name"
               required>

        <input type="text"
               name="category"
               value="{{ book.category }}"
               placeholder="Category"
               required>

        <input type="number"
               name="quantity"
               value="{{ book.quantity }}"
               placeholder="Quantity"
               required>

        <button type="submit">
            Update Book
        </button>

    </form>

    <br>

    <a href="{{ url_for('home') }}">
        Back to Home
    </a>

</div>

</body>

</html>
